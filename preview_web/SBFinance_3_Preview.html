<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#7115fa"/><title>SB Finance 3 · Preview</title>
<style>

ht:43px;flex-shrink:0;border-radius:15px;background:#f0e8ff;color:var(--p);display:grid;place-items:center}.entry-icon.in{background:#e5faf1;color:var(--green)}.entry-main{flex:1;min-width:0}.entry-name{font-size:13px;font-weight:720;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry-sub{font-size:11px;color:var(--muted);margin-top:4px}.entry-money{font-weight:750;font-size:13px;white-space:nowrap}.entry-money.in{color:var(--green)}.bottom{position:absolute;bottom:0;left:0;right:0;position:fixed;max-width:440px;margin:auto;height:87px;padding:10px 10px calc(14px + env(safe-area-inset-bottom));background:#fffdfef2;border-top:1px solid #f0edf7;display:flex;justify-content:space-around;backdrop-filter:blur(20px);z-index:20}.nav{background:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#9891a1;min-width:62px;font-size:10px;font-weight:630}.nav.active{color:var(--p)}.nav .nav-icon{width:36px;height:36px;display:grid;place-items:center}.nav.plus .nav-icon{width:45px;height:45px;background:linear-gradient(135deg,#6014ef,#a554ff);border-radius:15px;color:white;box-shadow:0 7px 15px #6418ee3b;margin-top:-9px}.page-title{font-size:23px;font-weight:800;letter-spacing:-.7px;margin:8px 0 5px}.page-sub{font-size:13px;color:var(--muted);margin:0 0 23px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:49px;border-radius:15px;background:linear-gradient(120deg,#6512f0,#943fff);color:#fff;font-weight:740;padding:0 19px;box-shadow:0 7px 20px #7426ee22}.btn.full{width:100%}.btn.outline{background:white;color:var(--p);border:1px solid #e6ddf4;box-shadow:none}.btn.ghost{background:#f2ecff;color:var(--p);box-shadow:none}.btn.danger{background:#fff2f5;color:#d93d66;box-shadow:none}.tiny{min-height:32px;border-radius:10px;padding:0 11px;font-size:11px}.space-between{display:flex;justify-content:space-between;align-items:center;gap:8px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.pill{background:white;border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:12px;font-weight:660;color:#7c718c}.pill.selected{border-color:#b889ff;background:#f0e5ff;color:#6413df}.form-field{display:block;font-size:12px;font-weight:680;color:#635a6f;margin:14px 0 7px}input,select{height:48px;border-radius:13px;background:#fcfbfe;border:1px solid #ded7eb;padding:0 13px;width:100%;color:var(--ink);font-size:14px}input::placeholder{color:#b3aaba}.quick-card{background:linear-gradient(135deg,#200448,#7114f1);color:white;border-radius:27px;padding:23px;margin-bottom:20px}.quick-card h2{font-size:23px;line-height:1.15;margin:13px 0 9px;letter-spacing:-.7px}.quick-card p{font-size:13px;color:#ffffffbf;margin:0;line-height:1.6}.hint{background:#f5efff;border-radius:14px;padding:13px;font-size:12px;color:#60408f;line-height:1.6;margin:12px 0}.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:16px;background:#fff;border-radius:18px;border:1px solid var(--line)}.metric span{color:var(--muted);font-size:11px}.metric strong{display:block;font-size:17px;margin-top:6px}.barbg{height:8px;border-radius:20px;background:#f1e9ff;overflow:hidden;margin:8px 0 14px}.bar{height:100%;background:linear-gradient(90deg,#5310e4,#a451ff);border-radius:20px}.due{color:#c04d71;font-weight:680;font-size:12px}.bill-acts{display:flex;gap:7px;margin-top:15px}.bill-acts .btn:first-child{flex:1}.muted{color:var(--muted)}.chip{background:#f1e7ff;border-radius:12px;padding:8px 10px;color:#7530c0;font-size:11px;font-weight:700}.empty{text-align:center;padding:21px 0}.empty-icon{font-size:30px;margin-bottom:8px}.empty h3{font-size:15px;margin:6px 0}.empty p{font-size:12px;color:var(--muted);line-height:1.6;margin:5px}.modal-overlay{position:fixed;inset:0;background:#1c1239aa;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{width:100%;max-width:440px;background:white;border-radius:28px 28px 19px 19px;padding:24px 2 </style></head><body><div class="shell"><main class="content" id="main"></main><nav class="bottom" id="nav" aria-label="Navegação principal"></nav></div><div id="modal-root"></div>
<script>
'use strict';
const storageKey='sbfinance_v3_preview_1';
const cats=['Alimentação','Transporte','Moradia','Saúde','Compras','Lazer','Educação','Assinaturas','Contas','Outros'];
const ico={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',chart:'<path d="M3 3v18h18M6 16l4-4 4 2 6-7"/>',add:'<path d="M12 5v14M5 12h14"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',spark:'<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 17l.6 1.4L21 19l-1.4.6L19 21l-.6-1.4L17 19l1.4-.6z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M10 2h4l.7 2.6 2.3 1.3 2.6-.7 2 3.5-2 1.9v2.8l2 1.9-2 3.5-2.6-.7-2.3 1.3L14 22h-4l-.7-2.6L7 18.1l-2.6.7-2-3.5 2-1.9v-2.8l-2-1.9 2-3.5 2.6.7 2.3-1.3z"/>',eye:'<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/>',eyeoff:'<path d="m3 3 18 18M10.5 6.1A10.8 10.8 0 0 1 12 6c6.4 0 10 6 10 6a15 15 0 0 1-3.2 3.6M6.2 6.2C3.4 8 2 12 2 12s3.6 6 10 6a11 11 0 0 0 3.6-.6"/>',arrowup:'<path d="m7 17 10-10M8 7h9v9"/>',arrowdown:'<path d="M7 7 17 17M8 17h9V8"/>',flag:'<path d="M4 21V4m0 1c6-5 10 5 16 0v11c-6 5-10-5-16 0"/>',edit:'<path d="m4 17 1-4 10-10 4 4-10 10-5 1zM13 5l4 4"/>',trash:'<path d="M4 7h16M10 4h4M6 7l1 14h10l1-14M10 10v8m4-8v8"/>',back:'<path d="m14 6-6 6 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',chev:'<path d="m9 18 6-6-6-6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',wallet:'<rect x="2" y="5" width="20" height="15" rx="3"/><path d="M16 11h6v5h-6a2 2 0 0 1 0-5z"/>'};
function icon(n,size=22){return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ico[n]||ico.wallet}</svg>`}
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const dateISO=(n=0)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const month=(d=dateISO())=>d.slice(0,7);
const nextMonth=d=>{let [y,m,day]=d.split('-').map(Number);let t=new Date(y,m,1,12);let last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(Math.min(day,last)).padStart(2,'0')}`};
const dateBR=d=>d?.split('-').reverse().join('/')||'—';
const cur=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n/100);
const cents=v=>{v=String(v??'').replace('R$','').replace(/\s/g,''); if(!v)return NaN;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');let n=Number(v);return Number.isFinite(n)&&n>0?Math.round(n*100):NaN};
const fixed=n=>String((n/100).toFixed(2)).replace('.',',');
function seed(){let sample=[['Salário',485000,'income','Outros',-12],['Supermercado',43290,'expense','Alimentação',-10],['Combustível',18500,'expense','Transporte',-7],['Cinema',5690,'expense','Lazer',-4],['Pastel',1250,'expense','Alimentação',-1]];return {demo:true,hide:false,notifyHour:9,entries:sample.map((x,i)=>({id:`demo${i}`,title:x[0],cents:x[1],kind:x[2],category:x[3],date:dateISO(x[4])})),bills:[{id:'b1',title:'Internet fibra',cents:11990,category:'Contas',nextDate:dateISO(3),total:0,paid:0,active:true,dueDay:Number(dateISO(3).slice(8))},{id:'b2',title:'Notebook',cents:28990,category:'Compras',nextDate:dateISO(7),total:10,paid:3,active:true,dueDay:Number(dateISO(7).slice(8))}],goals:[{id:'g1',title:'Reserva de emergência',target:1000000,saved:245000}],budgets:{'Alimentação':70000,'Transporte':30000}}}
let state;try{state=JSON.parse(localStorage.getItem(storageKey))||seed()}catch{state=seed()}
let tab='home',extra='',filter='all',query='',statMonth=month();
const save=()=>{localStorage.setItem(storageKey,JSON.stringify(state));render()};
const id=()=>String(Date.now())+'_'+Math.random().toString(16).slice(2,8);
const income=a=>a.filter(e=>e.kind==='income').reduce((s,e)=>s+e.cents,0);
const expense=a=>a.filter(e=>e.kind==='expense').reduce((s,e)=>s+e.cents,0);
const posted=()=>state.entries.filter(e=>e.date<=dateISO());
const realBalance=()=>income(posted())-expense(posted());
const pending=()=>state.bills.filter(b=>b.active);
const predicted=()=>realBalance()-pending().reduce((s,b)=>s+b.cents,0);
const byMonth=(m=month())=>state.entries.filter(e=>month(e.date)===m);
const display=n=>state.hide?'R$ •••••':cur(n);
const demoBanner=()=>state.demo?`<div class="demo-banner"><strong>✦ Dados de demonstração.</strong> Os valores são fictícios, só para visualizar o app. <button data-action="empty">Começar com meus dados</button></div>`:'';
function header(title='SB Finance',subtitle='Seu dinheiro sob controle',back=false){return `<header class="app-header">${back?`<button class="round-btn" data-action="back" aria-label="Voltar">${icon('back')}</button>`:`<div class="brand">$B</div>`}<div class="h-group"><div class="h-title">${title}</div><div class="sub">${subtitle}</div></div>${back?'':`<button class="round-btn" data-action="settings" aria-label="Configurações">${icon('gear',20)}</button>`}</header>`}
const section=(title,right='',action='')=>`<div class="section-head"><h2>${title}</h2>${right?`<button class="text-link" data-action="${action}">${right}</button>`:''}</div>`;
const empty=(h,p)=>`<div class="empty"><div class="empty-icon">✦</div><h3>${h}</h3><p>${p}</p></div>`;
function entryLine(e,ed=true){let inCome=e.kind==='income';return `<div class="entry"><div class="entry-icon ${inCome?'in':''}">${icon(inCome?'arrowdown':'arrowup',20)}</div><div class="entry-main"><div class="entry-name">${esc(e.title)}</div><div class="entry-sub">${esc(e.category)} · ${dateBR(e.date)}</div></div><div class="entry-money ${inCome?'in':''}">${state.hide?'••••':(inCome?'+':'−')+cur(e.cents)}</div>${ed?`<button data-action="edit-entry" data-id="${esc(e.id)}" aria-label="Editar ${esc(e.title)}" class="round-btn" style="width:28px;height:28px;border:0">${icon('edit',14)}</button>`:''}</div>`}
function svgChart(nums){let high=Math.max(1,...nums),w=332,h=134,p=12;let pts=nums.map((v,i)=>[Math.round(i/(nums.length-1||1)*w),Math.round(h-p-(v/high)*(h-2*p))]);let d=pts.map((a,i)=>(i?'L':'M')+a.join(',')).join(' '),area=d+` L${w},${h} L0,${h} Z`;return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Gráfico de despesas"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3cff" stop-opacity=".20"/><stop offset="1" stop-color="#8a3cff" stop-opacity="0"/></linearGradient></defs>${[22,59,96].map(y=>`<path d="M0 ${y}H${w}" stroke="#f0edf6" stroke-width="1"/>`).join('')}<path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="#771bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="5" fill="#771bfa" stroke="white" stroke-width="2"/></svg></div>`}
function home(){let m=byMonth(),bills=pending().sort((a,b)=>a.nextDate.localeCompare(b.nextDate));let last=state.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);let days=Array.from({length:7},(_,i)=>dateISO(i-6));return `${header()}${demoBanner()}<section class="balance"><div class="bal-top"><div class="label">Saldo disponível</div><button data-action="toggle" aria-label="${state.hide?'Mostrar':'Ocultar'} saldo">${icon(state.hide?'eyeoff':'eye',18)}</button></div><div class="bigmoney">${display(realBalance())}</div><div class="balance-rule"></div><small>Após as próximas contas cadastradas</small><div class="forecast">${display(predicted())}</div></section><div class="stat-row"><div class="stat"><div class="stat-name">${icon('arrowdown',15)} Entradas do mês</div><div class="stat-val">${display(income(m))}</div></div><div class="stat out"><div class="stat-name">${icon('arrowup',15)} Saídas do mês</div><div class="stat-val">${display(expense(m))}</div></div></div>${section('Acesso rápido')}<div class="shortcuts">${[['Despesa','arrowup','add-expense'],['Receita','arrowdown','add-income'],['Contas','calendar','bills'],['Metas','flag','goals']].map(([s,i,a])=>`<button class="shortcut" data-action="${a}"><span class="shortcut-icon">${icon(i,25)}</span>${s}</button>`).join('')}</div><div class="card">${section('Resumo do mês',month().split('-').reverse().join('/'))}${svgChart(days.map(d=>m.filter(e=>e.kind==='expense'&&e.date===d).reduce((s,e)=>s+e.cents,0)))}<div class="chart-meta"><span>7 dias atrás</span><span>Hoje</span></div><div class="small-note">Gastos registrados por dia · últimos 7 dias</div></div>${bills.length?`<div class="card">${section('Próximas contas','Ver todas','bills')}${bills.slice(0,2).map(b=>`<div class="entry"><div class="entry-icon">${icon('calendar',19)}</div><div class="entry-main"><div class="entry-name">${esc(b.title)}</div><div class="entry-sub">${dateBR(b.nextDate)} · ${due(b.nextDate)}</div></div><strong>${display(b.cents)}</strong></div>`).join('')}</div>`:''}${section('Últimas movimentações','Ver todas','history')}<div class="card">${last.length?last.map(e=>entryLine(e,false)).join(''):empty('Nenhum lançamento ainda','Adicione uma receita ou despesa para começar.')}</div>`}
function charts(){let m=byMonth(statMonth),days=new Date(Number(statMonth.slice(0,4)),Number(statMonth.slice(5,7)),0).getDate();let daily=Array.from({length:days},(_,i)=>m.filter(e=>e.date===statMonth+'-'+String(i+1).padStart(2,'0')&&e.kind==='expense').reduce((s,e)=>s+e.cents,0));let byCat={};m.filter(e=>e.kind==='expense').forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+e.cents});let total=expense(m);return `${header('Gráficos','Entenda seus hábitos')}<div class="space-between" style="margin-bottom:18px"><button class="round-btn" data-action="prev-month">${icon('back',19)}</button><strong>${new Date(statMonth+'-02T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong><button class="round-btn" data-action="next-month">${icon('chev',19)}</button></div><div class="metric-row"><div class="metric"><span>Receitas</span><strong>${display(income(m))}</strong></div><div class="metric"><span>Despesas</span><strong>${display(total)}</strong></div></div><div class="card" style="margin-top:20px">${section('Evolução de gastos','Por dia')}${svgChart(daily)}<div class="chart-meta"><span>Dia 1</span><span>Dia ${days}</span></div></div><div class="card">${section('Gastos por categoria')}${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>`<div class="space-between" style="font-size:13px"><span>${esc(cat)}</span><strong>${display(val)}</strong></div><div class="barbg"><div class="bar" style="width:${Math.max(1,val/Math.max(total,1)*100)}%"></div></div>`).join(''):empty('Sem despesas nesse período','Os gráficos aparecerão após você registrar gastos.')}</div><div class="card">${section('Resultado do mês')}<h2 style="color:${income(m)>=total?'var(--green)':'var(--red)'}">${display(income(m)-total)}</h2><p class="small-note">Receitas menos despesas registradas neste mês.</p></div>`}
function add(){return `${header('Adicionar','Anote em segundos')}${demoBanner()}<div class="quick-card">${icon('spark',29)}<h2>Escreva como você fala.</h2><p>Gastei 5 reais com pastel<br>Recebi 2500 de salário</p></div><div class="card"><label class="form-field" for="phrase">O que aconteceu?</label><input id="phrase" placeholder="Gastei 18,90 em um lanche"/><div class="hint" id="parsed-preview">Sua mensagem será interpretada localmente. Você confirma antes de salvar.</div><button class="btn full" data-action="natural">Revisar lançamento</button></div>${section('Ou escolha como lançar')}<div class="metric-row"><button class="btn outline" data-action="add-expense">${icon('arrowup',18)} Despesa</button><button class="btn outline" data-action="add-income">${icon('arrowdown',18)} Receita</button></div>`}
const due=d=>{let start=new Date(dateISO()+'T12:00:00'),end=new Date(d+'T12:00:00'),days=Math.round((end-start)/86400000);return days<0?`Atrasada ${Math.abs(days)} dia(s)`:days===0?'Vence hoje':days===1?'Vence amanhã':`Em ${days} dias`};
function bills(){let list=state.bills.filter(b=>filter==='done'?!b.active:b.active).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));return `${header('Contas e parcelas','Seus vencimentos')}${demoBanner()}<div class="metric-row" style="margin-bottom:16px"><div class="metric"><span>Próximas contas</span><strong>${display(pending().reduce((s,b)=>s+b.cents,0))}</strong></div><div class="metric"><span>Pagamentos feitos</span><strong>${display(expense(state.entries.filter(e=>e.billId)))}</strong></div></div><button class="btn full" data-action="add-bill">${icon('add',19)} Nova conta ou parcela</button><div class="pills" style="margin-top:19px"><button class="pill ${filter!=='done'?'selected':''}" data-action="filter-bills" data-value="active">Pendentes</button><button class="pill ${filter==='done'?'selected':''}" data-action="filter-bills" data-value="done">Concluídas</button></div>${list.length?list.map(b=>`<div class="card"><div class="space-between"><div><strong style="font-size:16px">${esc(b.title)}</strong><div class="sub">${b.total?`${b.paid}/${b.total} parcelas pagas`:'Mensal recorrente'} · ${esc(b.category)}</div></div><strong>${display(b.cents)}</strong></div><p class="${b.nextDate<dateISO()?'due':'sub'}" style="margin:14px 0 7px">${b.active?`${due(b.nextDate)} · ${dateBR(b.nextDate)}`:'Todas as parcelas concluídas'}</p>${b.total?`<div class="barbg"><div class="bar" style="width:${Math.min(100,b.paid/b.total*100)}%"></div></div>`:''}<div class="bill-acts">${b.active?`<button class="btn tiny" data-action="pay-bill" data-id="${esc(b.id)}">${icon('check',15)} Marcar paga</button>`:''}<button class="btn outline tiny" data-action="edit-bill" data-id="${esc(b.id)}">Editar</button><button class="btn danger tiny" data-action="delete-bill" data-id="${esc(b.id)}">Excluir</button></div></div>`).join(''):`<div class="card">${empty('Nenhuma conta aqui','Crie sua primeira despesa fixa ou parcela.')}</div>`}<div class="hint">Contas pendentes não reduzem o saldo real. A despesa é lançada apenas quando você marca como paga.</div>`}
function analyze(){let a=byMonth(),s=expense(a),i=income(a),out=[];if(!a.length)out.push('Registre receitas e despesas para receber análises personalizadas.');else{if(i)out.push(`Você gastou ${Math.round(s/i*100)}% das receitas deste mês.`);else out.push(`Você gastou ${cur(s)} este mês, mas ainda não registrou receitas.`);let g={};a.filter(e=>e.kind==='expense').forEach(e=>g[e.category]=(g[e.category]||0)+e.cents);let top=Object.entries(g).sort((a,b)=>b[1]-a[1])[0];if(top)out.push(`Maior categoria de gastos: ${top[0]} (${cur(top[1])}).`);if(i&&s>i*.8)out.push('Atenção: seus gastos já passaram de 80% das receitas registradas.');else if(i>s)out.push(`Você teve diferença positiva de ${cur(i-s)} neste mês.`)}let soon=pending().filter(b=>b.nextDate<=dateISO(7)).length;if(soon)out.push(`Você tem ${soon} conta(s) com vencimento próximo ou em atraso.`);Object.entries(state.budgets).forEach(([cat,lim])=>{let v=a.filter(e=>e.kind==='expense'&&e.category===cat).reduce((s,e)=>s+e.cents,0);if(lim>0&&v>lim)out.push(`Orçamento de ${cat} ultrapassado em ${cur(v-lim)}.`)});out.push(`Saldo projetado após próximas contas cadastradas: ${cur(predicted())}. Não inclui outros gastos futuros.`);return out}
function assistant(){return `${header('Assistente','Análises financeiras locais')}<div class="quick-card">${icon('spark',29)}<h2>Seu dinheiro,<br>mais claro.</h2><p>Entenda seus hábitos com base nos seus lançamentos — sem enviar dados para a internet.</p></div>${section('Seu diagnóstico')}${analyze().map((t,i)=>`<div class="card"><div class="assistant-insight"><div class="ball">${icon(i%2?'chart':'spark',19)}</div><p>${esc(t)}</p></div></div>`).join('')}<div class="card"><strong>Registre por mensagem</strong><label class="form-field" for="assist-phrase">Digite seu lançamento</label><input id="assist-phrase" placeholder="Gastei 35 com gasolina"/><button class="btn full" style="margin-top:12px" data-action="natural-assist">Analisar e registrar</button><div class="small-note">O assistente usa regras locais de análise, não IA generativa.</div></div>`}
function history(){let list=state.entries.filter(e=>(filter==='all'||e.kind===filter)&&(!query||e.title.toLowerCase().includes(query)||e.category.toLowerCase().includes(query))).slice().sort((a,b)=>b.date.localeCompare(a.date));return `${header('Histórico','Todas as movimentações',true)}<input id="search" value="${esc(query)}" placeholder="Buscar por título ou categoria" aria-label="Buscar lançamentos"/><div class="pills" style="margin-top:16px">${[['Todos','all'],['Receitas','income'],['Despesas','expense']].map(([t,v])=>`<button class="pill ${filter===v?'selected':''}" data-action="filter-history" data-value="${v}">${t}</button>`).join('')}</div><div class="card">${list.length?list.map(e=>`${entryLine(e,true)}<button class="text-link" data-action="delete-entry" data-id="${esc(e.id)}" style="font-size:11px">Excluir lançamento</button>`).join(''):empty('Sem resultados','Ajuste a pesquisa ou registre uma movimentação.')}</div>`}
function goals(){return `${header('Minhas metas','Seu futuro em construção',true)}<button class="btn full" data-action="add-goal">${icon('add',18)} Nova meta</button><div style="height:20px"></div>${state.goals.length?state.goals.map(g=>`<div class="card"><div class="space-between"><strong>${esc(g.title)}</strong><span class="chip">${Math.min(100,Math.round(g.saved/Math.max(g.target,1)*100))}%</span></div><h2 style="margin:14px 0 3px">${display(g.saved)}</h2><div class="sub">de ${display(g.target)}</div><div class="barbg" style="margin-top:16px"><div class="bar" style="width:${Math.min(100,g.saved/Math.max(1,g.target)*100)}%"></div></div><div class="bill-acts"><button class="btn tiny outline" data-action="edit-goal" data-id="${esc(g.id)}">Atualizar</button><button class="btn tiny danger" data-action="delete-goal" data-id="${esc(g.id)}">Excluir</button></div></div>`).join(''):`<div class="card">${empty('Nenhuma meta criada','Crie uma reserva de emergência, viagem ou outro objetivo.')}</div>`}<div class="hint">As metas são acompanhamento de reservas. O dinheiro não é descontado automaticamente do saldo.</div>`}
function settings(){return `${header('Configurações','Tudo do seu jeito',true)}${section('Orçamentos mensais')}<div class="card settings-list">${cats.map(cat=>`<button data-action="budget" data-value="${esc(cat)}"><span>${cat}</span><strong style="color:var(--p)">${state.budgets?.[cat]?cur(state.budgets[cat]):'Definir'}</strong></button>`).join('')}</div>${section('Notificações')}<div class="card"><div class="space-between"><div><strong>Horário de lembretes</strong><div class="sub">3 dias, 1 dia, vencimento e atraso</div></div><div class="chip">${String(state.notifyHour||9).padStart(2,'0')}:00</div></div><p class="small-note">Na versão Android, os lembretes são agendados pelo sistema. Esta prévia web só mostra contas pendentes quando está aberta.</p><button class="btn ghost tiny" data-action="set-hour" style="margin-top:9px">Alterar horário</button></div>${section('Backup e privacidade')}<div class="card"><button class="btn outline full" data-action="export">${icon('download',17)} Exportar backup JSON</button><label class="btn outline full" style="margin-top:10px;display:flex;cursor:pointer">Importar backup JSON<input type="file" id="import-file" accept=".json,application/json" style="display:none"/></label><button class="btn danger full" style="margin-top:10px" data-action="erase">Apagar todos os dados</button><p class="small-note">Dados guardados neste navegador. Sem contas bancárias conectadas. Na versão Android, dados ficam no dispositivo.</p></div><p class="small-note" style="text-align:center">SB Finance 3.0 · Preview interativo</p>`}
function render(){const screens={home,charts,add,bills,assistant,history,goals,settings};document.querySelector('#main').innerHTML=(screens[tab]||home)();const nav=[['home','home','Início'],['charts','chart','Gráficos'],['add','add','Adicionar'],['bills','calendar','Fixas'],['assistant','spark','Assistente']];document.querySelector('#nav').style.display=['history','goals','settings'].includes(tab)?'none':'flex';document.querySelector('#main').style.paddingBottom=['history','goals','settings'].includes(tab)?'35px':'116px';document.querySelector('#nav').innerHTML=nav.map(([key,ic,label])=>`<button class="nav ${tab===key?'active':''} ${key==='add'?'plus':''}" data-action="tab" data-value="${key}" ${tab===key?'aria-current="page"':''}><span class="nav-icon">${icon(ic,21)}</span><span>${label}</span></button>`).join('')}
function showModal(title,inner,submit,onSubmit){let root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-overlay"><form class="modal" id="modal"><div class="space-between"><h2>${title}</h2><button class="round-btn" type="button" data-action="close-modal" aria-label="Fechar">×</button></div>${inner}<div id="error" role="alert"></div><div class="footer"><button type="button" class="btn outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn">${submit||'Salvar'}</button></div></form></div>`;root.querySelector('#modal').addEventListener('submit',e=>{e.preventDefault();try{onSubmit(new FormData(e.currentTarget));closeModal()}catch(err){root.querySelector('#error').innerHTML=`<div class="feedback">${esc(err.message)}</div>`}})}
const closeModal=()=>document.getElementById('modal-root').innerHTML='';
const field=(name,label,val='',type='text',extra='')=>`<label class="form-field" for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(val)}" ${extra} required/>`;
const categoryField=(val='Outros')=>`<label class="form-field" for="f-category">Categoria</label><select name="category" id="f-category">${cats.map(c=>`<option ${val===c?'selected':''}>${c}</option>`).join('')}</select>`;
const blankState=()=>({demo:false,hide:false,notifyHour:9,entries:[],bills:[],goals:[],budgets:{}});
function entryModal(kind='expense',existing=null,fromParsed=null){let e=existing||fromParsed||{title:'',cents:0,kind,category:'Outros',date:dateISO()};showModal(existing?'Editar lançamento':'Novo lançamento',`<div class="pills" style="margin-top:14px"><span class="chip">${e.kind==='income'?'Receita':'Despesa'}</span></div>${field('title','Descrição',e.title)}${field('amount','Valor em reais',e.cents?fixed(e.cents):'','text','inputmode="decimal"')}${e.kind==='expense'?categoryField(e.category):''}${field('date','Data',e.date||dateISO(),'date')}`,'Salvar',f=>{let v=cents(f.get('amount'));if(!v)throw Error('Informe um valor positivo.');let d=String(f.get('date'));if(!/^\d{4}-\d{2}-\d{2}$/.test(d))throw Error('Data inválida.');let val={...e,id:e.id||id(),title:String(f.get('title')).trim(),cents:v,kind:e.kind,category:e.kind==='income'?'Outros':String(f.get('category')||e.category),date:d};if(!val.title)throw Error('Informe uma descrição.');if(existing){state.entries=state.entries.map(x=>x.id===existing.id?val:x)}else state.entries.unshift(val);save()})}
function billModal(b=null){let x=b||{title:'',cents:0,category:'Contas',nextDate:dateISO(7),total:0,paid:0,active:true};showModal(b?'Editar conta':'Nova conta ou parcela',`${field('title','Nome da conta',x.title)}${field('amount','Valor por pagamento (R$)',x.cents?fixed(x.cents):'','text','inputmode="decimal"')}${categoryField(x.category)}${field('nextDate','Próximo vencimento',x.nextDate,'date')}<label class="form-field" for="bill-kind">Tipo</label><select id="bill-kind" name="kind"><option value="monthly" ${x.total===0?'selected':''}>Mensal recorrente</option><option value="installments" ${x.total>0?'selected':''}>Parcelada</option></select>${field('total','Total de parcelas (para tipo parcelada)',x.total||'','number','min="1" max="360"')}<p class="small-note">Para conta mensal, deixe parcelas em branco. Pagamentos anteriores não são removidos.</p>`,'Salvar',f=>{let v=cents(f.get('amount'));if(!v)throw Error('Valor inválido.');let date=String(f.get('nextDate'));let total=f.get('kind')==='monthly'?0:Number(f.get('total'));if(f.get('kind')!=='monthly'&&(!Number.isInteger(total)||total<1||total>360))throw Error('Digite de 1 a 360 parcelas.');if(b&&total>0&&total<b.paid)throw Error('Total menor que as parcelas pagas.');let value={...x,id:x.id||id(),title:String(f.get('title')).trim(),cents:v,category:String(f.get('category')),nextDate:date,total,paid:x.paid||0,dueDay:Number(date.slice(8)),active:total===0||total>(x.paid||0)};if(!value.title)throw Error('Informe um nome.');if(b)state.bills=state.bills.map(q=>q.id===b.id?value:q);else state.bills.push(value);save()})}
function goalModal(g=null){let x=g||{title:'',target:0,saved:0};showModal(g?'Atualizar meta':'Nova meta',`${field('title','Nome da meta',x.title)}${field('target','Objetivo (R$)',x.target?fixed(x.target):'','text','inputmode="decimal"')}${field('saved','Valor reservado (R$)',fixed(x.saved),'text','inputmode="decimal"')}<p class="small-note">Não desconta automaticamente do saldo.</p>`,'Salvar',f=>{let target=cents(f.get('target'));let sraw=String(f.get('saved')).trim();let saved=/^0+(?:[.,]0+)?$/.test(sraw)?0:cents(sraw);if(!target||!Number.isFinite(saved))throw Error('Informe valores válidos.');let result={...x,id:x.id||id(),title:String(f.get('title')).trim(),target,saved};if(!result.title)throw Error('Informe um nome.');if(g)state.goals=state.goals.map(q=>q.id===g.id?result:q);else state.goals.push(result);save()})}
function detectCategory(s){s=s.toLowerCase();let rules={'Alimentação':['mercado','pastel','comida','ifood','restaurante','pizza','lanche','café','coxinha','padaria'],'Transporte':['uber','combust','gasolina','ônibus','99','passagem'],'Moradia':['aluguel','condomínio','reforma'],'Saúde':['farmácia','médico','remédio','dentista'],'Compras':['loja','roupa','shopee','amazon','sapato'],'Lazer':['cinema','show','viagem','jogo'],'Educação':['curso','escola','livro'],'Assinaturas':['netflix','spotify','disney','assinatura'],'Contas':['energia','luz','água','internet','fatura']};return Object.entries(rules).find(([_,keys])=>keys.some(k=>s.includes(k)))?.[0]||'Outros'}
function parsePhrase(s){let found=String(s||'').match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?![\d.,])\s*(?:reais|real)?/i);if(!found)return null;let val=cents(found[1]);if(!val)return null;let kind=/recebi|ganhei|sal[aá]rio|renda|entrou|vendi|pix recebido/i.test(s)?'income':'expense';let title=s.replace(found[0],' ').replace(/\b(gastei|paguei|comprei|recebi|ganhei|de|com|em|por|reais|real|renda|um|uma)\b/gi,' ').replace(/\s+/g,' ').trim()|| (kind==='income'?'Receita':'Despesa');return {title:title[0].toUpperCase()+title.slice(1),cents:val,kind,category:kind==='income'?'Outros':detectCategory(title),date:dateISO()}}
function payBill(idValue){let b=state.bills.find(x=>x.id===idValue&&x.active);if(!b)return;let period=b.nextDate;if(state.entries.some(e=>e.billId===b.id&&e.billPeriod===period))return alert('Este vencimento já foi lançado.');state.entries.unshift({id:id(),title:b.title,cents:b.cents,kind:'expense',category:b.category,date:dateISO(),billId:b.id,billPeriod:period});b.paid++;if(b.total&&b.paid>=b.total)b.active=false;let [y,m]=period.split('-').map(Number);let next=new Date(y,m,1);let last=new Date(next.getFullYear(),next.getMonth()+1,0).getDate();b.nextDate=`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(Math.min(b.dueDay||Number(period.slice(8)),last)).padStart(2,'0')}`;save()}
function confirmAction(title,body,onConfirm){showModal(title,`<p class="muted" style="line-height:1.6">${body}</p>`,'Confirmar',()=>onConfirm())}
function exportData(){let blob=new Blob([JSON.stringify({...state,schema:3},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='SBFinance3-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreData(file){file.text().then(t=>{let s=JSON.parse(t);if(!Array.isArray(s.entries)||!Array.isArray(s.bills)||!Array.isArray(s.goals))throw Error('Backup inválido');if(new Set(s.entries.map(e=>e.id)).size!==s.entries.length)throw Error('Identificadores duplicados');state={...blankState(),...s,
 bills:s.bills.map(b=>({...b,total:b.total??b.installmentCount??0,paid:b.paid??b.completedCount??0,dueDay:b.dueDay??Number(b.nextDate?.slice(8)||1)})),
 hide:s.hide??s.hideBalance??false,demo:false};save();alert('Backup restaurado!')}).catch(e=>alert('Erro: '+e.message))}
function go(where){tab=where;filter=where==='bills'?'active':'all';query='';render();window.scrollTo(0,0)}
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,v=el.dataset.value,ix=el.dataset.id;switch(a){case'tab':go(v);break;case'back':go('home');break;case'settings':go('settings');break;case'add-expense':entryModal('expense');break;case'add-income':entryModal('income');break;case'bills':go('bills');break;case'goals':go('goals');break;case'history':go('history');break;case'toggle':state.hide=!state.hide;save();break;case'empty':confirmAction('Começar com meus dados','Isto apagará os dados fictícios de demonstração e abrirá uma carteira vazia.',()=>{state=blankState();save()});break;case'prev-month':{let [y,m]=statMonth.split('-').map(Number);let d=new Date(y,m-2,1);statMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();break}case'next-month':{let[y,m]=statMonth.split('-').map(Number);let d=new Date(y,m,1);statMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();break}case'close-modal':closeModal();break;case'add-bill':billModal();break;case'edit-bill':billModal(state.bills.find(b=>b.id===ix));break;case'delete-bill':confirmAction('Excluir conta?','Pagamentos já registrados permanecerão no histórico.',()=>{state.bills=state.bills.filter(b=>b.id!==ix);save()});break;case'pay-bill':confirmAction('Confirmar pagamento?','A parcela será registrada nas despesas e o vencimento avançará.',()=>payBill(ix));break;case'filter-bills':filter=v;render();break;case'filter-history':filter=v;render();break;case'edit-entry':entryModal('expense',state.entries.find(e=>e.id===ix));break;case'delete-entry':confirmAction('Excluir lançamento?','Esta exclusão não reabre automaticamente uma conta já paga.',()=>{state.entries=state.entries.filter(e=>e.id!==ix);save()});break;case'add-goal':goalModal();break;case'edit-goal':goalModal(state.goals.find(g=>g.id===ix));break;case'delete-goal':confirmAction('Excluir meta?','A meta será removida, mas movimentações financeiras não mudam.',()=>{state.goals=state.goals.filter(g=>g.id!==ix);save()});break;case'budget':showModal('Orçamento: '+v,field('amount','Limite mensal (R$)',state.budgets?.[v]?fixed(state.budgets[v]):'','text','inputmode="decimal"')+'<p class="small-note">Deixe vazio para remover o limite.</p>','Salvar',f=>{let raw=f.get('amount'),amount=raw?cents(raw):0;if(!Number.isFinite(amount))throw Error('Valor inválido.');state.budgets[v]=amount;save()});break;case'set-hour':showModal('Horário de lembretes',field('hour','Hora (0 a 23)',state.notifyHour||9,'number','min="0" max="23"'),'Salvar',f=>{let n=Number(f.get('hour'));if(!Number.isInteger(n)||n<0||n>23)throw Error('Informe um horário de 0 a 23');state.notifyHour=n;save()});break;case'export':exportData();break;case'erase':confirmAction('Apagar todos os dados?','Esta ação não pode ser desfeita. Faça um backup antes.',()=>{state=blankState();save()});break;case'natural':case'natural-assist':{let phrase=document.getElementById(a==='natural'?'phrase':'assist-phrase')?.value||'';let parsed=parsePhrase(phrase);if(!parsed)return alert('Digite um valor, como "Gastei 5 reais com pastel".');entryModal(parsed.kind,null,parsed);break}}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){let start=ev.target.selectionStart;query=ev.target.value.toLowerCase();render();let el=document.getElementById('search');el.focus();el.setSelectionRange(start,start)}if(ev.target.id==='phrase'){let p=parsePhrase(ev.target.value),el=document.getElementById('parsed-preview');if(el)el.innerHTML=p?`<strong>Prévia:</strong> ${esc(p.title)} · ${esc(p.category)} · <strong>${cur(p.cents)}</strong>`:'Informe um valor, por exemplo: "Gastei 25,50 no mercado".'}});
document.addEventListener('change',ev=>{if(ev.target.id==='import-file'&&ev.target.files[0]){if(confirm('Substituir todos os dados atuais pelo backup?'))restoreData(ev.target.files[0])}});
render();
